; =============================================================
; Supervisor — Fidow Queue Worker
; À copier dans : /etc/supervisor/conf.d/fidow-worker.conf
; =============================================================

[program:fidow-queue-worker]

; ------------------------------------------------------------------
; Commande à exécuter (chemin du projet sur le VPS)
; ------------------------------------------------------------------
command=/usr/bin/php /var/www/Projets/nealix/fidow/artisan queue:work database --sleep=3 --tries=3 --backoff=60 --max-time=3600

; ------------------------------------------------------------------
; Répertoire de travail
; ------------------------------------------------------------------
directory=/var/www/Projets/nealix/fidow

; ------------------------------------------------------------------
; Utilisateur qui exécute le worker (adapte selon ton VPS)
; Souvent www-data sur Ubuntu avec Nginx
; ------------------------------------------------------------------
user=www-data

; ------------------------------------------------------------------
; Gestion des processus
; ------------------------------------------------------------------
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=1
startretries=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stopwaitsecs=60

; ------------------------------------------------------------------
; Logs
; ------------------------------------------------------------------
stdout_logfile=/var/www/Projets/nealix/fidow/storage/logs/worker-stdout.log
stderr_logfile=/var/www/Projets/nealix/fidow/storage/logs/worker-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3

; ------------------------------------------------------------------
; Environnement — s'assure que Laravel trouve le bon .env
; ------------------------------------------------------------------
environment=APP_ENV="production"
